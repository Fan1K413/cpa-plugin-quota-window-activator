plugins:
  enabled: true
  dir: plugins
  configs:
    quota-window-activator:
      enabled: true
      priority: 10
      dry_run: true
      observation_interval: 30m
      reset_grace_period: 60s
      verify_delay: 3s
      suppression_duration: 10m
      request_timeout: 30s
      max_retries: 5
      max_concurrency: 2
      providers:
        codex:
          enabled: true
        antigravity:
          enabled: true
      disabled_credentials: []
